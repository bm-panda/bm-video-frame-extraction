[bmscriptsbox]

[bmscriptsbox.info]
id = "9d2c6b4a-1e8f-4a3c-9b7d-5c0e2f8a41b3"
name = "视频抽帧"
desc = "基于 FFmpeg 的视频抽帧脚本 | 支持按秒/按帧间隔、指定时间点、关键帧、智能抽帧(相似度去重),输出 PNG 图片序列,一键批量抽帧"
version = "1.3.0"
icon = "./imgs/img.png"

[bmscriptsbox.runtime]
language = "python"
language_version = ">=3.12"
entry = "main.py"
terminal = "inverse"
binaries = [{name = "ffmpeg"}, {name="webview-cli"}]

[bmscriptsbox.triggers.context_menu]
enabled = true
targets = ["files"]
filters = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
           ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]

[bmscriptsbox.triggers.shortcut]
enabled = true
input_type = "files"
filters = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
           ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]

[[bmscriptsbox.inputs]]
name = "target_paths"
type = "list"
exts = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
        ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]
